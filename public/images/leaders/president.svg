<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16302A"/>
      <stop offset="100%" stop-color="#10241E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A24B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8A6C2B" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bgGrad)"/>
  <!-- Geometric background ornament -->
  <g opacity="0.15" stroke="#C9A24B" stroke-width="1" fill="none">
    <circle cx="200" cy="200" r="140"/>
    <rect x="100" y="100" width="200" height="200" transform="rotate(45 200 200)"/>
    <rect x="100" y="100" width="200" height="200"/>
  </g>
  <!-- Stylized Leader Silhouette -->
  <g fill="#EDE6D6" opacity="0.85">
    <circle cx="200" cy="180" r="65" />
    <path d="M 80 440 C 80 300, 120 270, 200 270 C 280 270, 320 300, 320 440 Z" />
  </g>
  <!-- Subtle Gold Frame -->
  <rect x="20" y="20" width="360" height="460" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
</svg>
