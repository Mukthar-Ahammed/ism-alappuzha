# Netlify detects Next.js and applies its OpenNext adapter automatically; there is no
# plugin to install. Secrets (Supabase keys) are set in the Netlify UI, never here.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # pdfjs-dist needs Node 22.13 or newer.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
